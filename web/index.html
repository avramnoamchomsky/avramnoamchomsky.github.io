<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chomsky — Embedded systems, Linux, NixOS, low-level software, and interactive Flutter Material 3 Expressive mini-apps.">
  <meta name="theme-color" content="#090b0c">
  <meta property="og:title" content="Chomsky — Embedded, Linux &amp; Interactive Apps">
  <meta property="og:description" content="Hyprland-inspired personal site with Material 3 Expressive mini-apps including Snake.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://avramnoamchomsky.github.io/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chomsky">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Chomsky — Embedded, Linux &amp; Interactive Apps</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #090b0c;
      color: #eef6ff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    #hypr-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #090b0c;
      z-index: 9999;
      transition: opacity 280ms ease, visibility 280ms ease;
    }

    #hypr-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #0e1216;
      border: 1px solid #1e293b;
      font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    .loader-mark {
      color: #58e1ff;
      font-weight: 700;
    }

    .loader-bar {
      width: 180px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .loader-bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: #58e1ff;
      animation: hypr-slide 1.1s ease-in-out infinite;
    }

    @keyframes hypr-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="hypr-loader" aria-label="Loading application">
    <div class="loader-pill">
      <span class="loader-mark">&gt;_</span>
      <span>chomsky@nixos</span>
    </div>
    <div class="loader-bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('hypr-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 320);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
